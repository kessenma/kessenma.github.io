# Shown under the headline on both the article and the homepage card.
standfirst: >-
  Aleph Alpha released Kolibri-1, an open model trained on an unusually large share of German.
  I tested whether it could write better training examples for my app's on-device German tutor
  than Google's Gemma 4 31B. Sadly... It couldn't.

# Kept separate from standfirst on purpose: search engines truncate around 160
# characters, so this is the short version. Reword both together.
