<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Die Kartei · OpenRouter</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f7f4ee; color: #1d1d1f;
    }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #f2f2f2; } }
    main { max-width: 22rem; padding: 0 16px; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    a { display: inline-block; margin-top: 1rem; padding: .6rem 1.1rem; border-radius: 10px;
        background: #c0392b; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Back to Die Kartei</h1>
    <p id="message">Finishing your OpenRouter sign-in&hellip;</p>
    <a id="back" href="kartei-openrouter://callback">Return to the app</a>
  </main>
  <script>
    // OpenRouter only redirects to https pages, so this one hands the sign-in code on to the app.
    // The code is useless without the one-time verifier the app kept, and nothing here stores it.
    (function () {
      var query = window.location.search;
      var target = "kartei-openrouter://callback" + query;
      document.getElementById("back").href = target;
      if (!/[?&]code=/.test(query)) {
        document.getElementById("message").textContent =
          "OpenRouter didn't send a sign-in code. Go back to the app and try again.";
      }
      window.location.replace(target);
    })();
  </script>
</body>
</html>
