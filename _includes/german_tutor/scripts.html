<script>
  /* WordGlitch — the hero field behind the header: rows of German words that turn
     over in place, crossfading through the article's blue palette. A word is only
     ever replaced by another of the same length, so the rows never re-flow and
     nothing shifts sideways under the title. Idles while the hero is off screen,
     and paints one static frame under prefers-reduced-motion. */
  (function () {
    var canvas = document.getElementById('gta-glitch');
    if (!canvas || !canvas.getContext) return;
    var hero = canvas.closest('.gta-hero');
    if (!hero) return;
    var ctx = canvas.getContext('2d');

    /* The grammar vocabulary the article is about, plus everyday words from the
       app's own decks. Every length here has at least two words so a swap always
       has somewhere to go. */
    var WORDS = (
      'an am im in zu so es du ja wo ob ' +
      'der die das den dem des ich wir sie ihr uns mit auf aus für und ist neu alt gut Tag ' +
      'eine kein mein dein noch doch wenn dass weil denn aber oder sehr mehr ganz gern üben ' +
      'Satz Wort Verb Buch Haus Kind Zeit Jahr Baum Land Hund ' +
      'einen einem Sätze Regel Nomen Kasus Dativ Übung Frage lesen sagen geben sehen gehen ' +
      'haben immer heute Woche Abend Blume Katze Stadt Leben schön klein danke bitte ' +
      'Wörter Regeln Verben Endung lernen denken machen kommen werden wollen müssen können ' +
      'sollen dürfen wissen morgen Wasser Straße Freund Mensch Fragen fertig ' +
      'Artikel Genitiv Präsens Perfekt Sprache Deutsch Antwort Übungen Wörtern gestern bleiben richtig ' +
      'Adjektiv Pronomen Vokabeln Endungen sprechen Zeitform ' +
      'Grammatik Akkusativ Nominativ verstehen Wortarten ' +
      'Nebensätze Hauptsätze Präteritum Konjunktiv ' +
      'Modalverben Hilfsverben Zeitangaben ' +
      'Wortstellung Reflexivverb'
    ).split(' ');

    /* Article palette: mostly the deep navy so the field reads as texture, the
       accent blues above it, and the badge amber turning up about one word in
       fifteen. */
    var COLORS = [
      '#1b3a63', '#1b3a63', '#1b3a63', '#1b3a63', '#1b3a63', '#1b3a63',
      '#0A5CCC', '#0A5CCC', '#12508f',
      '#007AFF', '#0A84FF', '#4DA3FF', '#8FC2FF',
      '#FF9F0A'
    ];

    var FONT = '600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    var LINE = 24;        /* row height, px */
    var GLITCH_MS = 90;   /* how often a batch of words turns over */
    var CHURN = 0.035;    /* share of the field that turns over each time */
    var FADE = 0.07;      /* colour crossfade step per frame */

    function hexToRgb(hex) {
      return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
      };
    }
    var RGB = COLORS.map(hexToRgb);

    var byLen = {};
    WORDS.forEach(function (w) { (byLen[w.length] = byLen[w.length] || []).push(w); });

    function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
    function css(c) { return 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')'; }
    function mix(a, b, t) {
      return {
        r: Math.round(a.r + (b.r - a.r) * t),
        g: Math.round(a.g + (b.g - a.g) * t),
        b: Math.round(a.b + (b.b - a.b) * t)
      };
    }

    var slots = [], cell = 8, size = { w: 0, h: 0 };
    var raf = null, last = 0;

    function build() {
      slots = [];
      var rows = Math.ceil(size.h / LINE) + 1;
      var cols = Math.ceil(size.w / cell);
      for (var r = 0; r < rows; r++) {
        /* start each row part-way into a word so the left edge stays ragged
           instead of forming a column of word beginnings */
        var c = -Math.floor(Math.random() * 8);
        while (c < cols) {
          var word = pick(WORDS);
          var col = pick(RGB);
          slots.push({ x: c * cell, y: r * LINE, word: word, from: col, to: col, p: 1, color: css(col) });
          c += word.length + 1 + Math.floor(Math.random() * 2);   /* one or two spaces */
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, size.w, size.h);
      ctx.font = FONT;
      ctx.textBaseline = 'top';
      for (var i = 0; i < slots.length; i++) {
        ctx.fillStyle = slots[i].color;
        ctx.fillText(slots[i].word, slots[i].x, slots[i].y);
      }
    }

    function measure() {
      var rect = hero.getBoundingClientRect();
      var w = Math.round(rect.width), h = Math.round(rect.height);
      if (!w || !h || (w === size.w && h === size.h)) return false;
      var dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = FONT;
      cell = ctx.measureText('M').width || 8;
      size = { w: w, h: h };
      build();
      return true;
    }

    function turnOver() {
      var n = Math.max(1, Math.round(slots.length * CHURN));
      for (var i = 0; i < n; i++) {
        var s = slots[Math.floor(Math.random() * slots.length)];
        if (!s) continue;
        s.word = pick(byLen[s.word.length]);
        s.from = mix(s.from, s.to, s.p);   /* crossfade out of whatever it shows now */
        s.to = pick(RGB);
        s.p = 0;
      }
    }

    function frame(now) {
      if (now - last >= GLITCH_MS) { turnOver(); last = now; }
      for (var i = 0; i < slots.length; i++) {
        var s = slots[i];
        if (s.p >= 1) continue;
        s.p = Math.min(1, s.p + FADE);
        s.color = css(mix(s.from, s.to, s.p));
      }
      draw();
      raf = requestAnimationFrame(frame);
    }

    function start() {
      if (raf) return;
      last = 0;
      raf = requestAnimationFrame(frame);
    }
    function stop() {
      if (!raf) return;
      cancelAnimationFrame(raf);
      raf = null;
    }

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    measure();
    draw();

    function onResize() { if (measure()) draw(); }
    if (window.ResizeObserver) {
      var pending;
      new ResizeObserver(function () {
        clearTimeout(pending);
        pending = setTimeout(onResize, 120);
      }).observe(hero);
    } else {
      var t;
      window.addEventListener('resize', function () {
        clearTimeout(t);
        t = setTimeout(onResize, 120);
      });
    }

    if (reduced) return;
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (entries) {
        entries[0].isIntersecting ? start() : stop();
      }).observe(hero);
    } else {
      start();
    }
  })();

  /* AnimatedStoryBook — page writes its lines in, turns, and starts a fresh page;
     phase label, progress bar and token counter roll alongside it. */
  (function () {
    var page = document.getElementById('gta-wpage');
    if (!page) return;
    var phaseEl = document.getElementById('gta-phase');
    var barEl = document.getElementById('gta-prog-bar');
    var tokEl = document.getElementById('gta-tokens');
    var phases = ['Warming up the tutor…', 'Writing your story…', 'Creating questions…', 'Building the glossary…', 'Drawing the pictures…', 'Fertig!'];
    var WRITING = 1; /* index of 'Writing your story…', the only phase that streams tokens */
    var pi = 0, tokens = 0, pct = 0;

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      page.classList.add('gta-live');
      if (barEl) barEl.style.width = '100%';
      return;
    }

    function writeCycle() {
      page.classList.remove('gta-live', 'gta-away');
      void page.offsetWidth; /* restart the line transitions */
      requestAnimationFrame(function () { page.classList.add('gta-live'); });
    }
    writeCycle();

    setInterval(function () {
      page.classList.add('gta-away');        /* turn the page */
      setTimeout(writeCycle, 380);            /* fresh page writes again */
      pi = (pi + 1) % phases.length;
      phaseEl.textContent = phases[pi];
      if (pi === WRITING) { tokens = 0; tokEl.textContent = '0 tokens'; }
    }, 3200);

    setInterval(function () {
      pct = (pct + 4) % 101;
      barEl.style.width = pct + '%';
      if (pi === WRITING) { tokens += 7; tokEl.textContent = tokens + ' tokens'; }
    }, 130);
  })();

  /* Feature flow — one phone cross-fading through its stages (Stories, Cards and
     Chatting each use one). The step rail is clickable; it auto-advances unless
     reduced-motion. Per-screen dwell comes from data-dwell (ms), default DWELL.
     Tapping a step holds that screen HOLD ms longer than usual, so you get a
     beat to read what you picked instead of it sliding on and making you click
     back. Any looping animation inside a screen (the story book, the card-stack
     shimmer, the word-tap choreography) runs on its own. Walks every .gta-fl. */
  (function () {
    var DWELL = 5200;  /* default time on a screen */
    var HOLD = 6000;   /* extra beat after you tap a step yourself */
    [].forEach.call(document.querySelectorAll('.gta-fl'), function (fl) {
      var screens = [].slice.call(fl.querySelectorAll('.gta-fl-screen'));
      var steps = [].slice.call(fl.querySelectorAll('.gta-fl-step'));
      if (!screens.length) return;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var idx = 0, timer;

      function dwellOf(i) { return parseInt(screens[i].getAttribute('data-dwell'), 10) || DWELL; }
      function show(i) {
        idx = (i + screens.length) % screens.length;
        screens.forEach(function (s, k) { s.classList.toggle('gta-on', k === idx); });
        steps.forEach(function (b, k) {
          b.classList.toggle('gta-on', k === idx);
          b.setAttribute('aria-selected', k === idx ? 'true' : 'false');
        });
      }
      function schedule(extra) {
        clearTimeout(timer);
        timer = setTimeout(function () { show(idx + 1); schedule(); }, dwellOf(idx) + (extra || 0));
      }
      steps.forEach(function (b, k) {
        b.addEventListener('click', function () { show(k); if (!reduced) schedule(HOLD); });
      });
      show(0);
      if (!reduced) schedule();
    });
  })();

  /* Feature gallery — scroll-snap slider with tabs, arrows, and a track that
     hugs the height of the current slide instead of the tallest one. */
  (function () {
    var gal = document.getElementById('gta-gal');
    if (!gal) return;
    var track = gal.querySelector('.gta-gal-track');
    var slides = [].slice.call(track.children);
    var tabs = [].slice.call(gal.querySelectorAll('.gta-gal-tab'));
    var idx = 0;
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function setHeight() { track.style.height = slides[idx].offsetHeight + 'px'; }
    function mark() {
      tabs.forEach(function (t, i) {
        t.classList.toggle('gta-on', i === idx);
        t.setAttribute('aria-current', i === idx ? 'true' : 'false');
      });
      setHeight();
    }
    function go(i) {
      idx = Math.max(0, Math.min(slides.length - 1, i));
      track.scrollTo({ left: idx * track.clientWidth, behavior: reduced ? 'auto' : 'smooth' });
      mark();
    }
    tabs.forEach(function (t, i) { t.addEventListener('click', function () { go(i); }); });
    [].forEach.call(gal.querySelectorAll('.gta-gal-btn'), function (b) {
      b.addEventListener('click', function () { go(idx + Number(b.getAttribute('data-dir'))); });
    });
    var raf;
    track.addEventListener('scroll', function () {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () {
        var i = Math.round(track.scrollLeft / track.clientWidth);
        if (i !== idx) { idx = i; mark(); }
      });
    });
    window.addEventListener('resize', function () {
      track.scrollLeft = idx * track.clientWidth;
      setHeight();
    });
    window.addEventListener('load', setHeight);
    mark();
  })();

  /* ControlExperiment — one held-out item at a time, fed to both models. The
     control and the tuned model answer independently; the scorer's verdict
     lands underneath each. */
  (function () {
    var root = document.getElementById('gta-ab');
    if (!root) return;
    var $ = function (id) { return document.getElementById(id); };
    var itemEl = $('gta-ab-item'), sentEl = $('gta-ab-sent'), truthEl = $('gta-ab-truth'),
        countEl = $('gta-ab-count');

    var lanes = {
      c: { think: $('gta-ab-cthink'), card: $('gta-ab-cverdict'), head: $('gta-ab-chead'),
           body: $('gta-ab-cbody'), why: $('gta-ab-cwhy'), mark: $('gta-ab-cmark') },
      e: { think: $('gta-ab-ethink'), card: $('gta-ab-everdict'), head: $('gta-ab-ehead'),
           body: $('gta-ab-ebody'), why: $('gta-ab-ewhy'), mark: $('gta-ab-emark') }
    };

    /* Three representative items: a correct sentence the control "fixes" anyway,
       a real error it waves through, and one it half-fixes. */
    var items = [
      {
        sent: 'Sie wartet auf ihren Freund.',
        truth: 'already correct — the model should say nothing',
        c: { v: 'FIX', body: 'Sie wartet auf ihren Freund.',
             why: '“warten auf” needs the accusative here.', ok: false,
             mark: '✕ False correction — it returned the identical sentence' },
        e: { v: 'OK', body: 'Correct as written.',
             why: '', ok: true,
             mark: '✓ Correctly left alone' }
      },
      {
        sent: 'Ich freue mich auf dem Wochenende.',
        truth: '“auf das Wochenende” — freuen auf takes the accusative',
        c: { v: 'OK', body: 'Correct as written.', why: '', ok: false,
             mark: '✕ Missed error — waved a real mistake through' },
        e: { v: 'FIX', body: 'Ich freue mich auf das Wochenende.',
             why: '“sich freuen auf” takes the accusative: auf das, not auf dem.', ok: true,
             mark: '✓ Right fix, right reason' }
      },
      {
        sent: 'Ich aufstehe um sieben Uhr.',
        truth: '“Ich stehe um sieben Uhr auf” — separable prefix goes last',
        c: { v: 'FIX', body: 'Ich stehe auf um sieben Uhr.',
             why: 'The verb “aufstehen” is separable.', ok: false,
             mark: '✕ Split the verb but left the prefix in the wrong place' },
        e: { v: 'FIX', body: 'Ich stehe um sieben Uhr auf.',
             why: 'Separable prefix moves to the end of the clause.', ok: true,
             mark: '✓ Right fix, right reason' }
      }
    ];

    function paint(lane, d) {
      lane.head.textContent = d.v;
      lane.head.classList.toggle('gta-ab-ok', d.v === 'OK');
      lane.body.textContent = d.body;
      lane.why.textContent = d.why;
      lane.mark.textContent = d.mark;
      lane.mark.classList.toggle('gta-ab-pass', d.ok);
      lane.mark.classList.toggle('gta-ab-fail', !d.ok);
    }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var first = items[0];
      sentEl.textContent = first.sent;
      truthEl.textContent = first.truth;
      paint(lanes.c, first.c); paint(lanes.e, first.e);
      ['c', 'e'].forEach(function (k) {
        lanes[k].card.classList.add('gta-on');
        lanes[k].mark.classList.add('gta-on');
      });
      return;
    }

    var timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    var i = 0;

    function cycle() {
      timers.forEach(clearTimeout);
      timers = [];
      var it = items[i];

      /* clear the previous verdicts, then swap the eval item in */
      ['c', 'e'].forEach(function (k) {
        lanes[k].card.classList.remove('gta-on');
        lanes[k].mark.classList.remove('gta-on');
        lanes[k].think.classList.remove('gta-on');
      });
      itemEl.classList.add('gta-ab-swap');

      later(function () {
        sentEl.textContent = it.sent;
        truthEl.textContent = it.truth;
        countEl.textContent = (i + 1) + ' / ' + items.length;
        paint(lanes.c, it.c);
        paint(lanes.e, it.e);
        itemEl.classList.remove('gta-ab-swap');
      }, 340);

      later(function () {                       // both models start generating
        lanes.c.think.classList.add('gta-on');
        lanes.e.think.classList.add('gta-on');
      }, 800);

      later(function () {                       // control answers first
        lanes.c.think.classList.remove('gta-on');
        lanes.c.card.classList.add('gta-on');
      }, 1900);
      later(function () { lanes.c.mark.classList.add('gta-on'); }, 2400);

      later(function () {                       // then the tuned model
        lanes.e.think.classList.remove('gta-on');
        lanes.e.card.classList.add('gta-on');
      }, 2700);
      later(function () { lanes.e.mark.classList.add('gta-on'); }, 3200);

      later(function () {                       // hold, then the next item
        i = (i + 1) % items.length;
        cycle();
      }, 6600);
    }
    cycle();
  })();

  /* MatchingGameView — one loop: match a pair (it clears with a spring), fumble
     a pair (red flash), recover it. Timer ticks like the real top bar. */
  (function () {
    var board = document.getElementById('gta-mg-board');
    if (!board) return;
    var $ = function (id) { return document.getElementById(id); };
    var bar = $('gta-mg-bar'), cap = $('gta-mg-cap'), timerEl = $('gta-mg-timer');
    var t = { apfel: $('gta-mg-apfel'), apple: $('gta-mg-apple'),
              ankunft: $('gta-mg-ankunft'), arrival: $('gta-mg-arrival'),
              alter: $('gta-mg-alter'), age: $('gta-mg-age') };
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var secs = 41;
    setInterval(function () {
      secs++;
      timerEl.textContent = secs < 60 ? secs + 's'
        : Math.floor(secs / 60) + 'm ' + ('0' + (secs % 60)).slice(-2) + 's';
    }, 1000);

    var timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function cls(el, c) { el.className = 'gta-mtile' + (c ? ' ' + c : ''); }

    function cycle() {
      timers.forEach(clearTimeout); timers = [];
      Object.keys(t).forEach(function (k) { cls(t[k], ''); });
      bar.style.width = '50%'; cap.textContent = '3 / 6 matched';

      later(function () { cls(t.apfel, 'gta-msel'); }, 700);      // correct pair clears
      later(function () { cls(t.apple, 'gta-msel'); }, 1500);
      later(function () {
        cls(t.apfel, 'gta-mgone'); cls(t.apple, 'gta-mgone');
        bar.style.width = '66%'; cap.textContent = '4 / 6 matched';
      }, 2100);
      later(function () { cls(t.ankunft, 'gta-msel'); }, 3300);   // wrong pair flashes red
      later(function () { cls(t.age, 'gta-msel'); }, 4100);
      later(function () { cls(t.ankunft, 'gta-mbad'); cls(t.age, 'gta-mbad'); }, 4500);
      later(function () { cls(t.ankunft, ''); cls(t.age, ''); }, 5150);
      later(function () { cls(t.ankunft, 'gta-msel'); }, 6300);   // second try lands
      later(function () { cls(t.arrival, 'gta-msel'); }, 7100);
      later(function () {
        cls(t.ankunft, 'gta-mgone'); cls(t.arrival, 'gta-mgone');
        bar.style.width = '83%'; cap.textContent = '5 / 6 matched';
      }, 7700);
      later(cycle, 10800);
    }
    cycle();
  })();

  /* GrammarMultipleChoiceView — the correct option goes green, the card swaps
     to the filled-in sentence, Next appears; then the next real question. */
  (function () {
    var card = document.getElementById('gta-gd-card');
    if (!card) return;
    var $ = function (id) { return document.getElementById(id); };
    var ask = $('gta-gd-ask'), res = $('gta-gd-res'), next = $('gta-gd-next'),
        pre = $('gta-gd-pre'), verb = $('gta-gd-verb'), noun = $('gta-gd-noun'),
        badge = $('gta-gd-badge'), fill = $('gta-gd-fill'), sub = $('gta-gd-sub'),
        count = $('gta-gd-count'), bar = $('gta-gd-bar');
    var opts = [$('gta-gd-o0'), $('gta-gd-o1'), $('gta-gd-o2')];

    /* both questions are real rows from grammar_exercises.json */
    var qs = [
      { pre: 'Ich', verb: 'habe', noun: 'Buch', badge: 'neutrum', ok: 2,
        fill: 'Ich habe das Buch.', sub: 'Buch · neutrum', count: '3 / 10', pct: '30%' },
      { pre: 'Er', verb: 'isst', noun: 'Apfel', badge: 'maskulin', ok: 0,
        fill: 'Er isst den Apfel.', sub: 'Apfel · maskulin', count: '4 / 10', pct: '40%' }
    ];
    var qi = 0;

    function paint(q) {
      pre.textContent = q.pre; verb.textContent = q.verb; noun.textContent = q.noun;
      badge.textContent = q.badge; fill.textContent = q.fill; sub.textContent = q.sub;
      count.textContent = q.count; bar.style.width = q.pct;
    }
    function answer(q) {
      opts.forEach(function (o, i) { o.className = 'gta-qopt ' + (i === q.ok ? 'gta-qok' : 'gta-qdim'); });
    }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      paint(qs[0]); answer(qs[0]);
      ask.classList.add('gta-off'); res.classList.remove('gta-off');
      next.classList.add('gta-on');
      return;
    }

    var timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

    function cycle() {
      timers.forEach(clearTimeout); timers = [];
      var q = qs[qi];
      paint(q);
      opts.forEach(function (o) { o.className = 'gta-qopt'; });
      ask.classList.remove('gta-off'); res.classList.add('gta-off');
      next.classList.remove('gta-on');

      later(function () { answer(q); }, 1600);                  // tap the right article
      later(function () {                                       // card flips to the result
        ask.classList.add('gta-off'); res.classList.remove('gta-off');
        next.classList.add('gta-on');
      }, 2400);
      later(function () { qi = (qi + 1) % qs.length; cycle(); }, 6200);
    }
    cycle();
  })();

  /* CollapsedTargets — a link into a collapsed <details> (a deep link to one of the
     methodology phases, say) would otherwise land on a hidden element. Open the
     details first, then scroll the target into view ourselves, since the browser
     already gave up on jumping to it. */
  (function () {
    function reveal(hash) {
      if (!hash || hash.length < 2) return;
      var target;
      try { target = document.getElementById(decodeURIComponent(hash.slice(1))); } catch (e) { return; }
      if (!target) return;

      var opened = false;
      for (var el = target.parentNode; el && el.closest; el = el.parentNode) {
        var d = el.closest('details');
        if (!d) break;
        if (!d.open) { d.open = true; opened = true; }
        el = d;
      }
      if (opened) target.scrollIntoView({ block: 'start' });
    }

    reveal(window.location.hash);
    window.addEventListener('hashchange', function () { reveal(window.location.hash); });
  })();
</script>
