<style>
  .gta-article {
    background: #000;
    min-height: 100vh;
    padding: 4rem 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    color: #fff;
    position: relative;

    /* app accent — iOS system blue #007AFF, plus its dark-mode variant and tints
       (matches the tint/accent used across the app, e.g. StorySetupView) */
    --accent: #007AFF;
    --accent-dm: #0A84FF;
    --accent-hi: #4DA3FF;
    --accent-soft: #8FC2FF;
    --accent-deep: #0A5CCC;

    /* chart tokens — tuned for surface #101011 (dark mode); scatter marks also carry
       direct text labels so no category rides on hue alone */
    --surface: #101011;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --shipped: #0A84FF;   /* fine-tuned, shipped */
    --over: #d95926;      /* over-corrector  */
    --under: #BF5AF2;     /* rubber-stamper  */
    --broken: #d03b3b;    /* fails both ways */
    --seg-1: #3987e5;
    --seg-2: #c98500;
    --seg-3: #5BD6E2;
    --seg-4: #9085e9;
  }
  /* ---------- icons ----------
     Inline Lucide glyphs emitted by _includes/german_tutor/icon.html. They sit on
     currentColor and default to 1em, so an icon takes the colour and scale of the
     text it sits in rather than needing a rule per call site. The negative
     vertical-align lands the 24x24 box on the text's optical centre instead of its
     baseline; SVG-mode icons are positioned by transform and skip this entirely. */
  .gta-article .gt-ico {
    vertical-align: -0.145em;
    flex-shrink: 0;
  }
  /* Icons that replaced a leading emoji in a heading or button need the same
     optical gap the emoji's own side bearing used to provide. */
  .gta-article .gt-ico-lead { margin-right: 0.4em; }

  /* ---------- background: app-style brand wash ----------
     Recreates the app's ModelBrandWash (a slow-drifting MeshGradient in the model's
     blue palette) with a few large blurred blobs instead of a particle field. */
  .gta-wash {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .gta-wash i {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    will-change: transform;
  }
  .gta-wash i:nth-child(1) {
    width: 58vw; height: 58vw;
    background: #007AFF; opacity: 0.20;
    top: -20%; left: -14%;
    animation: gta-drift-1 38s ease-in-out infinite alternate;
  }
  .gta-wash i:nth-child(2) {
    width: 44vw; height: 44vw;
    background: #4DA3FF; opacity: 0.13;
    top: 20%; right: -18%;
    animation: gta-drift-2 46s ease-in-out infinite alternate;
  }
  .gta-wash i:nth-child(3) {
    width: 52vw; height: 52vw;
    background: #0A5CCC; opacity: 0.18;
    bottom: -24%; left: 16%;
    animation: gta-drift-3 52s ease-in-out infinite alternate;
  }
  .gta-wash i:nth-child(4) {
    width: 30vw; height: 30vw;
    background: #7FB8FF; opacity: 0.10;
    bottom: 6%; right: 4%;
    animation: gta-drift-2 60s ease-in-out infinite alternate-reverse;
  }
  @keyframes gta-drift-1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(9vw, 7vh) scale(1.15); } }
  @keyframes gta-drift-2 { from { transform: translate(0, 0) scale(1.05); } to { transform: translate(-8vw, 9vh) scale(0.95); } }
  @keyframes gta-drift-3 { from { transform: translate(0, 0) scale(1); } to { transform: translate(7vw, -8vh) scale(1.12); } }
  .gta-article * {
    display: revert;
    text-align: revert;
  }
  .gta-article .gta-container {
    max-width: 860px;
    margin: 0 auto;
    background: rgba(24, 24, 26, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(10, 132, 255, 0.28);
    border-radius: 22px;
    padding: 3rem 2.5rem;
    position: relative;
    z-index: 1;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), 0 0 80px rgba(0, 122, 255, 0.07);
  }

  /* ---------- hero: German word-glitch field ----------
     The header sits on a canvas of German words that turn over in place (see the
     WordGlitch block in scripts.html). The band bleeds out through the
     container's padding so the field reaches its inner edge, and rounds its top
     corners to sit inside the container's 22px radius.

     Two overlay layers do the legibility work: a scrim weighted to the left,
     where the title and standfirst sit, and an outer vignette that fades the
     field's edges out so it reads as texture rather than a pasted-in rectangle.
     The canvas itself is masked downward, dissolving into the article body. */
  .gta-article .gta-hero {
    position: relative;
    isolation: isolate;          /* keeps the field's z-index: -1 above the band's own background */
    margin: -3rem -2.5rem 2.5rem;
    padding: 3rem 2.5rem 2rem;
    border-radius: 21px 21px 0 0;
    overflow: hidden;
    border-bottom: 1px solid #38383A;
    background: linear-gradient(180deg, rgba(4, 8, 16, 0.72) 0%, rgba(10, 12, 18, 0.30) 100%);
  }
  .gta-article .gta-hero-bg {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }
  .gta-article .gta-hero-bg canvas {
    display: block;
    width: 100%;
    height: 100%;
    opacity: 0.8;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 58%, rgba(0, 0, 0, 0.35) 88%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 58%, rgba(0, 0, 0, 0.35) 88%, transparent 100%);
  }
  .gta-article .gta-hero-bg i {
    position: absolute;
    inset: 0;
  }
  .gta-article .gta-hero-scrim {
    background: radial-gradient(115% 135% at 20% 44%,
      rgba(6, 9, 14, 0.90) 0%, rgba(6, 9, 14, 0.72) 38%,
      rgba(6, 9, 14, 0.34) 70%, rgba(6, 9, 14, 0) 100%);
  }
  .gta-article .gta-hero-vig {
    background: radial-gradient(circle at 50% 42%,
      rgba(8, 10, 16, 0) 38%, rgba(8, 10, 16, 0.55) 78%, rgba(8, 10, 16, 0.92) 100%);
  }

  /* ---------- header ---------- */
  .gta-article .gta-header {
    margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid #38383A;
  }
  /* inside the hero the band owns the spacing and the rule underneath it */
  .gta-article .gta-hero .gta-header {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
  }
  .gta-article .gta-hero .gta-header h1 { text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9); }
  .gta-article .gta-hero .gta-standfirst,
  .gta-article .gta-hero .gta-byline { text-shadow: 0 1px 12px rgba(0, 0, 0, 0.85); }
  .gta-article .gta-badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #FF9F0A;
    border: 1px solid rgba(255, 159, 10, 0.4);
    background: rgba(255, 159, 10, 0.08);
    border-radius: 100px;
    padding: 0.25rem 0.7rem;
    margin-bottom: 1rem;
  }
  .gta-article .gta-titlerow {
    display: flex;
    align-items: center;
    gap: 1.1rem;
  }
  .gta-article .gta-appicon {
    width: 62px;
    height: 62px;
    border-radius: 14px;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
  }
  .gta-article .gta-header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: #0A84FF;
    margin: 0 0 0.75rem 0;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .gta-article .gta-titlerow h1 { margin-bottom: 0; }
  .gta-article .gta-standfirst {
    font-size: 1.1rem;
    line-height: 1.6;
    color: #aaa;
    margin: 1.25rem 0 1.5rem 0;
  }
  .gta-article .gta-byline {
    font-size: 0.85rem;
    color: #8E8E93;
  }
  .gta-article .gta-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.5rem;
  }
  .gta-article .gta-links a {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: #4DA3FF;
    border: 1px solid rgba(10, 132, 255, 0.3);
    border-radius: 100px;
    padding: 0.35rem 0.85rem;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  .gta-article .gta-links a:hover { background: rgba(10, 132, 255, 0.12); }

  /* ---------- KPI row ---------- */
  .gta-article .gta-kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem;
    margin: 2rem 0 2.5rem 0;
  }
  .gta-article .gta-kpi {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid #2C2C2E;
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }
  .gta-article .gta-kpi-value {
    display: block;
    font-size: 1.5rem;
    font-weight: 700;
    color: #0A84FF;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  .gta-article .gta-kpi-label {
    display: block;
    font-size: 0.75rem;
    color: #8E8E93;
    margin-top: 0.35rem;
    line-height: 1.35;
  }

  /* ---------- table of contents ---------- */
  .gta-article .gta-toc {
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid #2C2C2E;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 2.5rem;
  }
  .gta-article .gta-toc h2 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8E8E93;
    margin: 0 0 0.75rem 0;
  }
  .gta-article .gta-toc ol { margin: 0; padding-left: 1.2rem; }
  .gta-article .gta-toc li {
    font-size: 0.9rem;
    line-height: 1.6;
    color: #ccc;
    list-style: decimal;
    margin-bottom: 0.2rem;
  }

  /* ---------- body copy ---------- */
  .gta-article h2 {
    font-size: 1.45rem;
    font-weight: 700;
    color: #0A84FF;
    margin: 3rem 0 1rem 0;
    letter-spacing: -0.01em;
    line-height: 1.3;
    scroll-margin-top: 2rem;
  }
  .gta-article h3 {
    font-size: 1.05rem;
    font-weight: 600;
    color: #4DA3FF;
    margin: 2rem 0 0.5rem 0;
  }
  .gta-article p {
    font-size: 1rem;
    line-height: 1.75;
    color: #d4d4d6;
    margin: 0 0 1.15rem 0;
  }
  .gta-article ul, .gta-article ol { padding-left: 1.35rem; margin: 0 0 1.25rem 0; }
  .gta-article li {
    font-size: 1rem;
    line-height: 1.75;
    color: #d4d4d6;
    margin-bottom: 0.5rem;
  }
  .gta-article ul > li { list-style: disc; }
  .gta-article ol > li { list-style: decimal; }
  .gta-article li::marker { color: #0A84FF; }
  .gta-article strong { color: #fff; font-weight: 650; }
  .gta-article em { color: #e4e4e6; }
  .gta-article u { color: #e4e4e6; text-decoration-color: rgba(10, 132, 255, 0.5); text-underline-offset: 2px; }
  .gta-article a {
    color: #0A84FF;
    text-decoration: none;
    border-bottom: 1px solid rgba(10, 132, 255, 0.35);
  }
  .gta-article a:hover { border-bottom-color: #0A84FF; }
  .gta-article code {
    font-family: 'SF Mono', ui-monospace, Menlo, monospace;
    font-size: 0.85em;
    background: rgba(10, 132, 255, 0.1);
    border: 1px solid rgba(10, 132, 255, 0.15);
    border-radius: 5px;
    padding: 0.1em 0.4em;
    color: #8FC2FF;
  }

  /* glossary term links */
  .gta-article a.gterm {
    color: #d4d4d6;
    border-bottom: 1px dotted rgba(10, 132, 255, 0.65);
  }
  .gta-article a.gterm:hover { color: #8FC2FF; border-bottom-style: solid; }

  /* ---------- pull-out lesson ---------- */
  .gta-article .gta-lesson {
    border-left: 3px solid #0A84FF;
    background: rgba(10, 132, 255, 0.06);
    border-radius: 0 10px 10px 0;
    padding: 1.1rem 1.4rem;
    margin: 1.75rem 0;
  }
  .gta-article .gta-lesson p { margin: 0; }
  .gta-article .gta-lesson p + p { margin-top: 0.85rem; }
  .gta-article .gta-lesson .gta-lesson-head {
    display: block;
    font-size: 1.02rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 0.4rem;
  }

  /* ---------- TODO callout ---------- */
  .gta-article .gta-todo {
    border: 1px dashed rgba(255, 159, 10, 0.5);
    background: rgba(255, 159, 10, 0.06);
    border-radius: 10px;
    padding: 0.9rem 1.2rem;
    margin: 1.75rem 0;
  }
  .gta-article .gta-todo p { margin: 0; font-size: 0.9rem; color: #E0A85A; }
  .gta-article .gta-todo .gta-todo-tag {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #FF9F0A;
    margin-right: 0.5rem;
  }

  /* ---------- tables ---------- */
  .gta-article .gta-table-wrap {
    overflow-x: auto;
    margin: 1.75rem 0;
    border: 1px solid #2C2C2E;
    border-radius: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .gta-article table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 0.88rem; }
  .gta-article thead th {
    background: rgba(10, 132, 255, 0.09);
    color: #8FC2FF;
    font-weight: 650;
    text-align: left;
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid #38383A;
    white-space: nowrap;
  }
  .gta-article tbody td {
    padding: 0.7rem 0.9rem;
    border-bottom: 1px solid #232325;
    color: #d4d4d6;
    line-height: 1.5;
    vertical-align: middle;
  }
  .gta-article tbody tr:last-child td { border-bottom: none; }
  .gta-article tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
  .gta-article tbody td:not(:first-child) { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gta-article .gta-row-win td { background: rgba(10, 132, 255, 0.07); }
  .gta-article .gta-row-win:hover td { background: rgba(10, 132, 255, 0.1); }
  .gta-article .gta-good { color: #0A84FF; font-weight: 650; }
  .gta-article .gta-bad { color: #FF453A; font-weight: 650; }
  .gta-article .gta-sub td:first-child { padding-left: 1.9rem; color: #9a9a9e; }
  .gta-article .gta-caption {
    font-size: 0.82rem;
    color: #8E8E93;
    margin: -1rem 0 1.75rem 0;
    line-height: 1.6;
  }
  /* model cell: logo + name */
  .gta-article .gta-model {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    white-space: nowrap;
  }
  .gta-article .gta-model img {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    flex-shrink: 0;
    object-fit: contain;
  }
  .gta-article .gta-model .gta-nologo {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    flex-shrink: 0;
    background: #2C2C2E;
    color: #8E8E93;
    font-size: 0.65rem;
    font-weight: 700;
    line-height: 20px;
    text-align: center;
  }
  .gta-article .gta-model a { border-bottom: none; color: #d4d4d6; }
  .gta-article .gta-model a:hover { color: #0A84FF; }
  .gta-article .gta-arrow { color: #6f6f74; padding: 0 0.15rem; }
  /* a condition or caveat riding along inside a numeric cell — the score is the figure,
     this is what it was measured under */
  .gta-article .gta-cell-note { color: #6f6f74; font-weight: 400; }
  .gta-article .gta-legend-note {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 1.25rem;
    font-size: 0.82rem;
    color: #8E8E93;
    margin: -1rem 0 1.75rem 0;
    line-height: 1.6;
  }

  /* ---------- figures / charts ---------- */
  .gta-article figure {
    margin: 2rem 0;
    background: var(--surface);
    border: 1px solid #2C2C2E;
    border-radius: 12px;
    padding: 1.5rem 1.5rem 1.25rem 1.5rem;
  }
  /* for figures whose own shape is the frame — no card behind them */
  .gta-article figure.gta-fig-bare {
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
  }
  .gta-article figure h4 {
    font-size: 0.95rem;
    font-weight: 650;
    color: #fff;
    margin: 0 0 0.25rem 0;
  }
  .gta-article figure .gta-fig-sub {
    font-size: 0.82rem;
    color: var(--ink-muted);
    margin: 0 0 1.25rem 0;
    line-height: 1.5;
  }
  .gta-article figcaption {
    font-size: 0.8rem;
    color: var(--ink-muted);
    line-height: 1.6;
    margin-top: 1rem;
    padding-top: 0.85rem;
    border-top: 1px solid #232325;
  }
  .gta-article .gta-svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* chart legend */
  .gta-article .gta-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
    margin-top: 1rem;
  }
  .gta-article .gta-legend span {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.8rem;
    color: var(--ink-2);
  }
  .gta-article .gta-legend i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .gta-article .gta-legend i.sq { border-radius: 2px; }

  /* scatter marks */
  .gta-article .gta-dot { transition: r 0.12s ease; cursor: default; }
  .gta-article .gta-dot:hover { r: 11; }
  .gta-article .gta-dot-label {
    font-size: 11px;
    fill: var(--ink-2);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .gta-article .gta-axis-label {
    font-size: 11.5px;
    fill: var(--ink-muted);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .gta-article .gta-tick {
    font-size: 10px;
    fill: var(--ink-muted);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .gta-article .gta-zone {
    font-size: 11px;
    fill: var(--ink-muted);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-style: italic;
  }

  /* stacked composition bar */
  .gta-article .gta-stack {
    display: flex;
    width: 100%;
    height: 44px;
    gap: 2px;
    margin-bottom: 0.6rem;
  }
  .gta-article .gta-stack div {
    border-radius: 3px;
    position: relative;
    transition: filter 0.15s ease;
  }
  .gta-article .gta-stack div:hover { filter: brightness(1.25); }
  .gta-article .gta-stack-labels {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.4rem;
    margin-bottom: 1.75rem;
  }
  .gta-article .gta-stack-labels span {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.82rem;
    color: var(--ink-2);
  }
  .gta-article .gta-stack-labels i { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .gta-article .gta-stack-labels b { color: #fff; font-variant-numeric: tabular-nums; font-weight: 650; }
  .gta-article .gta-bar-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin: 0 0 0.6rem 0;
  }

  /* ---------- pipeline diagram ---------- */
  .gta-article .gta-pipe {
    display: flex;
    align-items: stretch;
    gap: 0.5rem;
    flex-wrap: nowrap;
  }
  .gta-article .gta-pipe-step {
    flex: 1;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid #2C2C2E;
    border-radius: 10px;
    padding: 0.9rem 0.9rem;
    min-width: 0;
  }
  .gta-article .gta-pipe-step.gta-pipe-gate { border-color: rgba(10, 132, 255, 0.45); background: rgba(10, 132, 255, 0.07); }
  .gta-article .gta-pipe-step h5 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #4DA3FF;
    margin: 0 0 0.5rem 0;
    font-weight: 700;
  }
  .gta-article .gta-pipe-step ul { margin: 0; padding-left: 0.95rem; }
  .gta-article .gta-pipe-step li {
    font-size: 0.78rem;
    line-height: 1.5;
    color: var(--ink-2);
    margin-bottom: 0.2rem;
    list-style: disc;
  }
  .gta-article .gta-pipe-arrow {
    align-self: center;
    color: #4a4a4e;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  /* ---------- GPU animation ---------- */
  .gta-article .gta-gpu-row {
    display: flex;
    align-items: center;
    gap: 1.75rem;
    flex-wrap: wrap;
  }
  .gta-article .gta-gpu-stats { flex: 1; min-width: 200px; }
  .gta-article .gta-gpu-stats dl { margin: 0; }

  .gta-article .gta-fan { transform-origin: center; transform-box: fill-box; animation: gta-spin 1.6s linear infinite; }

  @keyframes gta-blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  @keyframes gta-dash { to { stroke-dashoffset: -20; } }
  @media (prefers-reduced-motion: reduce) {

  }

  /* ---------- five-hats hub ---------- */
  .gta-article .gta-hub { display: grid; place-items: center; padding: 0.5rem 0; }
  .gta-article .gta-hub svg { max-width: 520px; width: 100%; height: auto; overflow: visible; }
  .gta-article .gta-hub-chip { filter: drop-shadow(0 0 22px rgba(0,122,255,0.45)); }
  .gta-article .gta-bob { animation: gta-bob 3.2s ease-in-out infinite; }
  .gta-article .gta-bob-2 { animation-delay: 0.4s; }
  .gta-article .gta-bob-3 { animation-delay: 0.8s; }
  .gta-article .gta-bob-4 { animation-delay: 1.2s; }
  .gta-article .gta-bob-5 { animation-delay: 1.6s; }
  .gta-article .gta-bob-6 { animation-delay: 2.0s; }
  @keyframes gta-bob { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-6px) } }
  .gta-article .gta-pulse { animation: gta-pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes gta-pulse { 0%,100%{ transform: scale(1); opacity: 0.95 } 50%{ transform: scale(1.04); opacity: 1 } }

  /* ---------- conversation two-pass ---------- */
  .gta-article .gta-conv { display: flex; gap: 1rem; align-items: stretch; flex-wrap: wrap; justify-content: center; }
  .gta-article .gta-conv svg { flex: 1 1 320px; max-width: 380px; }
  /* typing dots as SVG-native circles — HTML <i> inside <svg> would break the
     parser out of SVG context and drop everything after it */
  .gta-article .gta-typing circle { transform-box: fill-box; transform-origin: center; animation: gta-typing 1.2s ease-in-out infinite; }
  .gta-article .gta-typing circle:nth-child(2){ animation-delay: 0.15s; }
  .gta-article .gta-typing circle:nth-child(3){ animation-delay: 0.3s; }
  @keyframes gta-typing { 0%,60%,100%{ transform: translateY(0); opacity: 0.5 } 30%{ transform: translateY(-6px); opacity: 1 } }

  /* ---------- matching grid ---------- */
  .gta-article .gta-match { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.55rem; max-width: 320px; margin: 0 auto; }
  .gta-article .gta-match-card { aspect-ratio: 3/2; border-radius: 10px; border: 1px solid #2C2C2E; background: #1a1a1d; display: grid; place-items: center; font-size: 0.92rem; font-weight: 650; color: #d4d4d6; position: relative; overflow: hidden; cursor: default; transition: transform 0.28s ease, border-color 0.2s ease; transform-style: preserve-3d; }
  .gta-article .gta-match-card.gta-matched { background: rgba(10,132,255,0.12); border-color: rgba(10,132,255,0.45); color: #8FC2FF; transform: scale(0.96); }
  .gta-article .gta-match-card.gta-miss { animation: gta-shake 0.35s ease; border-color: #d03b3b; }
  @keyframes gta-shake { 0%,100%{ transform: translateX(0)} 25%{ transform: translateX(-4px)} 75%{ transform: translateX(4px)} }
  .gta-article .gta-match-card .gta-front { position: absolute; inset: 0; display: grid; place-items: center; background: #232326; transition: opacity 0.28s ease; }
  .gta-article .gta-match-card.gta-flipped .gta-front { opacity: 0; pointer-events: none; }

  /* ---------- grammar quiz ---------- */
  .gta-article .gta-quiz { background: #141416; border: 1px solid #2C2C2E; border-radius: 14px; padding: 1rem 1.2rem; max-width: 420px; margin: 0 auto; }
  .gta-article .gta-quiz-q { font-size: 1.05rem; font-weight: 600; color: #fff; margin: 0 0 0.8rem 0; line-height: 1.4; }
  .gta-article .gta-quiz-q b { color: #4DA3FF; }
  .gta-article .gta-quiz-opt { display: block; width: 100%; text-align: left; font-size: 0.92rem; padding: 0.6rem 0.9rem; margin: 0 0 0.5rem 0; border-radius: 10px; border: 1px solid #2C2C2E; background: #1e1e21; color: #d4d4d6; cursor: pointer; transition: all 0.18s ease; }
  .gta-article .gta-quiz-opt:hover { border-color: #4DA3FF; }
  .gta-article .gta-quiz-opt.gta-correct { background: rgba(10,132,255,0.14); border-color: #0A84FF; color: #8FC2FF; }
  .gta-article .gta-quiz-opt.gta-wrong { background: rgba(208,59,59,0.12); border-color: #d03b3b; color: #e08a8a; }

  /* ---------- memory loop ---------- */
  .gta-article .gta-loop { display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: center; justify-content: center; }
  .gta-article .gta-loop svg { flex: 0 0 320px; max-width: 100%; }
  .gta-article .gta-loop-steps { flex: 1; min-width: 220px; }
  .gta-article .gta-loop-steps dl { margin: 0; }
  .gta-article .gta-loop-steps div { display: flex; gap: 0.6rem; padding: 0.5rem 0; border-bottom: 1px solid #232325; }
  .gta-article .gta-loop-steps div:last-child { border-bottom: none; }
  .gta-article .gta-loop-steps dt { font-size: 1.05rem; }
  .gta-article .gta-loop-steps dd { font-size: 0.85rem; color: var(--ink-2); margin: 0; line-height: 1.45; }
  .gta-article .gta-loop-flow { stroke-dasharray: 6 8; animation: gta-dash 1.6s linear infinite; }

  /* ---------- today plan ---------- */
  .gta-article .gta-today { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.7rem; margin: 1rem 0; }
  .gta-article .gta-today-card { background: #151518; border: 1px solid #2C2C2E; border-radius: 12px; padding: 0.9rem 1rem; position: relative; overflow: hidden; }
  .gta-article .gta-today-card:before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--c1), var(--c2)); }
  .gta-article .gta-today-card h5 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: #8E8E93; margin: 0 0 0.35rem 0; }
  .gta-article .gta-today-card p { font-size: 0.9rem; color: #fff; margin: 0; line-height: 1.35; }

  .gta-article .gta-fstack small { font-size: 0.66rem; color: #8E8E93; line-height: 1.3; }

  /* segmented picker — tinted selection like the app's accent */
  .gta-article .gta-seg { display: flex; background: #2C2C2E; border-radius: 8px; padding: 2px; gap: 2px; }
  .gta-article .gta-seg i {

  /* iOS toggle */

  /* the big gradient generate button (theme.linear, white foreground) */
  .gta-article .gta-write-btn {
    margin-top: 1rem;

    padding: 0.6rem 0.5rem;

    box-shadow: 0 6px 18px rgba(0, 122, 255, 0.35);

  /* GeneratingStoryView — the little book that writes itself (now the flow's generating screen) */
  .gta-article .gta-book { position: relative; width: 220px; height: 244px; margin: 0 auto 0.4rem; }
  .gta-article .gta-book-glow {
    position: absolute;
    left: 50%; top: 50%;

    position: absolute;
    left: 50%; top: 14px;
    width: 160px; height: 190px;

    background: #26262b;
    border: 1px solid rgba(10, 132, 255, 0.4);
  }

  .gta-article .gta-back2 { transform: translate(-5px, 4px) rotate(-2deg); box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3); }

  .gta-article .gta-phase { font-size: 0.9rem; font-weight: 650; color: #fff; min-height: 1.25em; margin-top: 0.4rem; }
  .gta-article .gta-prog { width: 200px; max-width: 100%; height: 5px; border-radius: 3px; background: #2C2C2E; margin: 0.6rem auto 0.35rem; overflow: hidden; }

  /* ---------- Stories: one phone, one flow (setup → generating → story → quiz) ---------- */
  .gta-article .gta-fl { display: flex; flex-direction: column; align-items: center; gap: 1.1rem; }
  .gta-article .gta-fl-screens { position: relative; height: 420px; }
  .gta-article .gta-fl-screen {
    position: absolute; inset: 0;

    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease;
    pointer-events: none;

  /* generating sits centered; the rest read top-down like a real screen */

  /* the setup screen is the tallest; tighten its rhythm so it clears the frame */

  /* finished-story screen */
  .gta-article .gta-fl-chips { display: flex; align-items: center; gap: 0.4rem; margin: 0.1rem 0 0.55rem; }
  .gta-article .gta-fl-chip {

  .gta-article .gta-fl-chip-lvl { background: rgba(10, 132, 255, 0.18); color: #4DA3FF; }
  .gta-article .gta-fl-wc { font-size: 0.66rem; color: #8E8E93; margin-left: auto; }
  .gta-article .gta-fl-illus {
    height: 116px; border-radius: 12px; margin-bottom: 0.6rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
    position: relative; overflow: hidden;
    background:
      radial-gradient(120% 80% at 78% 18%, rgba(255, 241, 209, 0.9) 0%, rgba(255, 241, 209, 0) 42%),
      linear-gradient(168deg, #16324e 0%, #2f6ea0 46%, #cfe0ee 100%);
  }
  /* a soft snow ridge, so it reads as an illustration rather than an empty box */
  .gta-article .gta-fl-illus::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 46%;

    mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M13.997%204a2%202%200%200%201%201.76%201.05l.486.9A2%202%200%200%200%2018.003%207H20a2%202%200%200%201%202%202v9a2%202%200%200%201-2%202H4a2%202%200%200%201-2-2V9a2%202%200%200%201%202-2h1.997a2%202%200%200%200%201.759-1.048l.489-.904A2%202%200%200%201%2010.004%204z%22%2F%3E%20%3Ccircle%20cx%3D%2212%22%20cy%3D%2213%22%20r%3D%223%22%2F%3E%3C%2Fsvg%3E") center / contain no-repeat;
  }
  .gta-article .gta-fl-title { font-size: 1.02rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
  .gta-article .gta-fl-body { display: flex; flex-direction: column; gap: 8px; }
  .gta-article .gta-fl-line { height: 5px; border-radius: 99px; background: rgba(107, 117, 140, 0.5); }
  .gta-article .gta-fl-pill {
    align-self: flex-start; margin-top: 0.8rem;

  .gta-article .gta-fl-weiter {

  /* ---------- methodology: the model funnel ----------
     One continuous funnel wall down each side. Every segment is a trapezoid whose
     bottom edge is exactly as wide as the next segment's top edge, so the sides
     read as a single straight line from 100% at the mouth to ~52% at the spout:

       --fn-w    the segment's own (top) width, in % of the funnel
       --fn-cut  how far each bottom corner pulls in, in % of the segment's width
       --fn-pad  the same inset, in % of the funnel — keeps text clear of the angle

     The two are the same distance expressed against different boxes: clip-path
     resolves % against the element, padding against the flex container. Widths are
     tuned to segment heights, so retitling a gate enough to change its height means
     re-tuning the pair below. */
  .gta-article .gta-funnel { display: flex; flex-direction: column; align-items: center; }

  .gta-article .gta-fn-band,
  .gta-article .gta-fn-gate {
    position: relative;
    width: var(--fn-w);
    box-sizing: border-box;
    border: 0;
    background: none;
  }
  /* the shape lives on a backdrop layer: clip-path would otherwise cut the border
     off the angled sides, and the text with it */
  .gta-article .gta-fn-band::before,
  .gta-article .gta-fn-gate::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--fn-cut)) 100%, var(--fn-cut) 100%);
  }
  .gta-article .gta-fn-band > *,
  .gta-article .gta-fn-gate > * { position: relative; z-index: 1; }

  .gta-article .gta-fn-band { padding: 0.7rem calc(var(--fn-pad) + 0.85rem) 0.8rem; }
  .gta-article .gta-fn-band::before { background: rgba(255, 255, 255, 0.05); }

  /* the wall — top width, bottom inset against self, same inset against the funnel */
  .gta-article .gta-fn-w0 { --fn-w: 100%;   --fn-cut: 4.54%; --fn-pad: 4.54%; }
  .gta-article .gta-fn-g1 { --fn-w: 90.92%; --fn-cut: 3.35%; --fn-pad: 3.04%; }
  .gta-article .gta-fn-w1 { --fn-w: 84.83%; --fn-cut: 3.00%; --fn-pad: 2.54%; }
  .gta-article .gta-fn-g2 { --fn-w: 79.75%; --fn-cut: 6.36%; --fn-pad: 5.07%; }
  .gta-article .gta-fn-w2 { --fn-w: 69.61%; --fn-cut: 2.98%; --fn-pad: 2.07%; }
  .gta-article .gta-fn-g3 { --fn-w: 65.46%; --fn-cut: 6.33%; --fn-pad: 4.15%; }
  .gta-article .gta-fn-w3 { --fn-w: 57.17%; --fn-cut: 4.54%; --fn-pad: 2.59%; }

  .gta-article .gta-fn-head {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin-bottom: 0.55rem;
  }
  .gta-article .gta-fn-head b { color: #fff; font-size: 0.95rem; font-weight: 700; letter-spacing: 0; }
  /* sub-heading inside the mouth of the funnel: the three intakes arrived months apart,
     and which cohort a candidate belongs to is what explains its scoring basis below */
  .gta-article .gta-fn-group {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #7c7b74;

  }
  .gta-article .gta-fn-chips + .gta-fn-group { margin-top: 0.75rem; }
  .gta-article .gta-fn-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .gta-article .gta-fn-chip {
    display: inline-flex;
    align-items: center;

  }
  .gta-article .gta-fn-chip img { width: 16px; height: 16px; border-radius: 4px; object-fit: contain; flex-shrink: 0; }
  .gta-article .gta-fn-chip i {
    width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
    background: #2C2C2E; color: #8E8E93;

  }
  .gta-article .gta-fn-chip em { color: var(--ink-muted); font-style: normal; font-variant-numeric: tabular-nums; }
  .gta-article .gta-fn-chip-win {

  /* the neck between bands — a funnel wall plus a falling spark */
  .gta-article .gta-fn-neck {
    width: 100%;
    height: 22px;
    position: relative;
    overflow: hidden;
  }
  .gta-article .gta-fn-neck i {
    position: absolute;
    left: 50%;
    top: 0;
    width: 1px;
    height: 100%;
    margin-left: -0.5px;
    background: linear-gradient(180deg, #2C2C2E, rgba(10, 132, 255, 0.55));
  }
  .gta-article .gta-fn-neck i::after {
    content: '';
    position: absolute;
    left: -2px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #4DA3FF;
    box-shadow: 0 0 8px rgba(77, 163, 255, 0.9);
    animation: gta-fn-fall 1.6s ease-in infinite;
  }
  @keyframes gta-fn-fall {
    0% { top: -6px; opacity: 0; }
    25% { opacity: 1; }
    100% { top: 22px; opacity: 0; }
  }

  .gta-article .gta-fn-gate { padding: 0.7rem calc(var(--fn-pad) + 0.9rem); }
  .gta-article .gta-fn-gate::before { background: rgba(10, 132, 255, 0.11); }
  /* amber reads far brighter than blue at the same alpha, so it carries less of it */
  .gta-article .gta-fn-gate-hot::before { background: rgba(255, 159, 10, 0.075); }
  .gta-article .gta-fn-gname { font-size: 0.86rem; font-weight: 650; color: #fff; line-height: 1.4; }
  .gta-article .gta-fn-gnum {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: #4DA3FF;
    background: rgba(10, 132, 255, 0.14);
    border-radius: 99px;
    padding: 0.12rem 0.5rem;
    margin-right: 0.45rem;
    vertical-align: 1px;
  }
  .gta-article .gta-fn-gate-hot .gta-fn-gnum { color: #FF9F0A; background: rgba(255, 159, 10, 0.14); }
  .gta-article .gta-fn-gtest { font-size: 0.76rem; color: var(--ink-muted); line-height: 1.5; margin-top: 0.15rem; }
  .gta-article .gta-fn-rejects { display: flex; flex-direction: column; gap: 0.25rem; margin-top: 0.6rem; }
  .gta-article .gta-fn-rej {
    font-size: 0.75rem;
    line-height: 1.45;
    color: #b0aea6;
    padding-left: 1.15rem;
    position: relative;
  }
  .gta-article .gta-fn-rej::before {
    /* Same inlined-mask trick as .gta-fl-illus::after — see the note there. */
    content: "";
    position: absolute;
    left: 0;
    top: 0.36em;
    width: 0.62rem; height: 0.62rem;
