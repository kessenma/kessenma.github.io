      <figcaption>

        rates. <strong>§</strong> marks a score that needs three worked examples in the prompt, which
        the app never sends — those four green points are a statement about the <em>base</em>, not
        about anything shippable, and two of the four carry non-commercial licences besides.
        Blue dashed arrows = a fine-tune moving toward the ideal corner: the E4B tune, and the
        Granite 3.3 tune driving false corrections to zero without touching its miss rate. Amber
        dashed arrow = the E2B fine-tune <em>appearing</em> to slide into over-correction — 18 of its

        discarded, a discovery that gets its own section
