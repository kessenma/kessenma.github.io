      <figcaption>
        Gate&nbsp;2 is each model's own baseline on the 60-item core suite; the ship row is the full
        203-item suite (core + extension + the frozen holdout). Round one's numbers are the raw
        checkpoint as first recorded — the 4&nbsp;GB sweep and the German-first models were measured
        after the scorer fix in <a href="#the-eval-was-lying">"The eval was lying"</a> and are scored
        the way the app actually renders a reply, so the two groups sit on slightly different rulers.
        The <strong>two Granites are the part I didn't predict</strong>: IBM spends its parameter
        budget on the body rather than the vocabulary, so they read German inefficiently and start
        below every Gemma — and they are the only bases in the survey that swallowed the full
        15-phenomenon corpus and got better for it. The 3.3&nbsp;2B is the first statistically
        significant paired win the project produced (+22 items, exact McNemar p&nbsp;=&nbsp;0.002);
        the 4.1&nbsp;3B beat its own stock score by 53 items and cut missed errors from 43% to 25%.
        Both now ship to the 4&nbsp;GB phones no Gemma tutor fits.
