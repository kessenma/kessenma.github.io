{% comment %} Shared chat input bar (pills + status + mic), reused by the chat/translate/hint screens of the conversation flow. {% endcomment %}
                  <div class="gta-inputbar">
                    <div class="gta-pills">
                      <span class="gta-pill"><span style="color:#FFD60A;">{% include german_tutor/icon.html name="lightbulb" %}</span> Hint</span>
                      <span class="gta-pill"><span style="color:#4DA3FF;">{% include german_tutor/icon.html name="speech" %}</span> Say it in German</span>
                    </div>
                    <div class="gta-status">Tap to speak</div>
                    <div class="gta-microw">
                      <div class="gta-mic">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                          <rect x="9" y="3" width="6" height="11" rx="3" fill="#fff" stroke="none"/>
                          <path d="M5 11a7 7 0 0 0 14 0"/>
                          <line x1="12" y1="18" x2="12" y2="21"/>
                        </svg>
                      </div>
                    </div>
                  </div>
